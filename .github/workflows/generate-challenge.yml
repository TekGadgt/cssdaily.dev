name: Generate Daily Challenge
on:
  schedule:
    - cron: '0 6 * * *' # 6am UTC daily
  workflow_dispatch: # Manual trigger, also used to backfill a missed day
    inputs:
      date:
        description: 'Challenge date (YYYY-MM-DD). Leave blank for tomorrow.'
        required: false
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-5.6-terra' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Compute challenge date
        id: date
        env:
          # Via env, never inline ${{ }} in run: — a dispatch input
          # interpolated into a shell line is a script-injection vector.
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$INPUT_DATE" ]; then
            echo "value=$(date -u -d '+1 day' '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$INPUT_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Invalid date '$INPUT_DATE' — expected YYYY-MM-DD"
            exit 1
          fi
          # Catches shape-valid but calendar-invalid dates like 2026-02-31.
          if ! date -u -d "$INPUT_DATE" >/dev/null 2>&1; then
            echo "::error::'$INPUT_DATE' is not a real calendar date"
            exit 1
          fi
          echo "value=$INPUT_DATE" >> "$GITHUB_OUTPUT"

      - name: Generate CSS challenge
        id: css
        continue-on-error: true
        env:
          CHALLENGE_DATE: ${{ steps.date.outputs.value }}
        run: npx tsx scripts/generate-challenge.ts "$CHALLENGE_DATE"

      - name: Generate Tailwind challenge
        id: tailwind
        continue-on-error: true
        env:
          CHALLENGE_DATE: ${{ steps.date.outputs.value }}
        run: npx tsx scripts/generate-tailwind-challenge.ts "$CHALLENGE_DATE"

      - name: Report generation results
        env:
          CSS_OUTCOME: ${{ steps.css.outcome }}
          TAILWIND_OUTCOME: ${{ steps.tailwind.outcome }}
          CHALLENGE_DATE: ${{ steps.date.outputs.value }}
        run: |
          echo "## Challenge Generation Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Date:** $CHALLENGE_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "**Generator:** $AI_PROVIDER / $AI_MODEL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CSS | $CSS_OUTCOME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tailwind | $TAILWIND_OUTCOME |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CSS_OUTCOME" = "failure" ] && [ "$TAILWIND_OUTCOME" = "failure" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Both generation steps failed.** Check the logs above for details (common causes: API credits exhausted, rate limit, network error)." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Both CSS and Tailwind challenge generation failed for $CHALLENGE_DATE"
            exit 1
          fi

          if [ "$CSS_OUTCOME" = "failure" ]; then
            echo "::warning::CSS challenge generation failed for $CHALLENGE_DATE"
          fi
          if [ "$TAILWIND_OUTCOME" = "failure" ]; then
            echo "::warning::Tailwind challenge generation failed for $CHALLENGE_DATE"
          fi

      - name: Commit and push
        env:
          CHALLENGE_DATE: ${{ steps.date.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/challenges/ public/targets/ src/data/tailwind-challenges/ public/targets/tailwind/
          git diff --cached --quiet || (git commit -m "Add daily challenges for $CHALLENGE_DATE" && git push)

      - name: Build Astro site
        run: |
          git pull
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
