name: Deploy to Cloudflare Workers

# Reusable: called by deploy.yml, whose workflow-level lock serializes
# production runs. The caller must upload the built site as artifact "dist"
# and the data it was built from as artifact "challenge-data".
on:
  workflow_call:
    inputs:
      sha:
        description: Commit the dist artifact was built from
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      R2_ASSETS_ACCESS_KEY_ID:
        required: true
      R2_ASSETS_SECRET_ACCESS_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Exactly the commit dist/ was built from, so wrangler.jsonc and the
      # lockfile-pinned wrangler always match the artifact.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      # Last guard: if main moved during the build, a newer run is queued
      # behind this one and owns the deploy (non-main dispatches skip here).
      - name: Skip if main has moved on
        id: tip
        env:
          BUILT_SHA: ${{ inputs.sha }}
        run: |
          TIP="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$TIP" = "$BUILT_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $BUILT_SHA: main is now $TIP, and that commit's run owns the deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: steps.tip.outputs.deploy == 'true'
        run: npm ci

      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/download-artifact@v4
        with:
          name: challenge-data
          path: .data/challenges

      # The lockfile-pinned wrangler from npm ci, run directly: no
      # third-party action ever sees the API token
      - name: Deploy to Cloudflare Workers
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Best-effort: the snapshot only serves credential-free local dev, so a
      # failure warns rather than failing a deploy that already succeeded
      - name: Publish public data snapshot
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ASSETS_ACCESS_KEY_ID: ${{ secrets.R2_ASSETS_ACCESS_KEY_ID }}
          R2_ASSETS_SECRET_ACCESS_KEY: ${{ secrets.R2_ASSETS_SECRET_ACCESS_KEY }}
          SOURCE_SHA: ${{ inputs.sha }}
        run: npx tsx scripts/publish-snapshot.ts --source-sha "$SOURCE_SHA" || echo "::warning::Public data snapshot was not published"
