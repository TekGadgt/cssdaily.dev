name: Normalize starter CSS (one-off)

# Rewrites every CSS challenge's starter CSS in D1 to the canonical
# `selector {` blank line `}` layout (scripts/normalize-starters.ts).
# Dry run unless "apply" is checked. Originals are uploaded as an artifact
# before any write; D1 Time Travel is the second safety net. Remove this
# workflow once it has been applied.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes (otherwise dry run)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

# Its own group: sharing the generator's would let this queued run replace
# (cancel) a pending generation run. Run it while nothing else is running.
concurrency:
  group: normalize-starter-css
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Normalize starter CSS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_WRITE_TOKEN: ${{ secrets.D1_WRITE_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then
            npx tsx scripts/normalize-starters.ts --apply --backup starter-css-backup.json
          else
            npx tsx scripts/normalize-starters.ts
          fi

      - name: Keep the originals
        if: always() && inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: starter-css-originals
          path: starter-css-backup.json
          retention-days: 90
          if-no-files-found: ignore

      # The site is prerendered from D1, so redeploy to publish the change
      - name: Redeploy
        if: success() && inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
